    <!-- ═══════════════════════════════════════════════════════
         CRITICAL INLINE CSS — loading screen always renders
         correctly even before main.min.css finishes loading
         ═══════════════════════════════════════════════════════ -->
    <style>
      *,*::before,*::after{box-sizing:border-box}
      html,body{margin:0;padding:0;background:#f8fbfc}
      body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#374151}
      #app{min-height:100vh}

      /* ── Premium loading screen ─────────────────────────────────────── */
      .loading-screen{
        position:fixed;inset:0;display:flex;flex-direction:column;
        align-items:center;justify-content:center;
        background:#f8fbfc;z-index:9999;gap:0
      }

      /* Top progress bar */
      .loading-bar{
        position:fixed;top:0;left:0;right:0;height:3px;
        background:linear-gradient(90deg,transparent 0%,#A64468 30%,#d472a0 60%,transparent 100%);
        background-size:200% 100%;
        animation:nu-bar 1.6s ease-in-out infinite
      }
      @keyframes nu-bar{
        0%{background-position:200% 0}
        100%{background-position:-200% 0}
      }

      /* Centre mark + spinning ring */
      .loading-mark-wrap{
        position:relative;width:96px;height:96px;
        display:flex;align-items:center;justify-content:center
      }
      .loading-mark{
        width:64px;height:64px;object-fit:contain;position:relative;z-index:2;
        animation:nu-breathe 2.8s ease-in-out infinite
      }
      @keyframes nu-breathe{
        0%,100%{transform:scale(1);opacity:1}
        50%{transform:scale(1.07);opacity:.9}
      }
      /* Spinning halo ring */
      .loading-ring{
        position:absolute;inset:0;border-radius:50%;
        border:2.5px solid transparent;
        border-top-color:#A64468;border-right-color:#d4729f;
        animation:nu-spin 1s cubic-bezier(.55,.15,.45,.85) infinite
      }
      /* Outer glow ring */
      .loading-ring::after{
        content:'';position:absolute;inset:-6px;border-radius:50%;
        border:1px solid rgba(166,68,104,.18);
        animation:nu-spin-rev 2.4s linear infinite
      }
      @keyframes nu-spin{to{transform:rotate(360deg)}}
      @keyframes nu-spin-rev{to{transform:rotate(-360deg)}}

      /* Three staggered dots below */
      .loading-dots{
        display:flex;gap:7px;margin-top:28px;align-items:center
      }
      .loading-dots span{
        width:7px;height:7px;border-radius:50%;background:#A64468;
        animation:nu-dot-pop 1.2s ease-in-out infinite;opacity:.25
      }
      .loading-dots span:nth-child(1){animation-delay:0s}
      .loading-dots span:nth-child(2){animation-delay:.2s}
      .loading-dots span:nth-child(3){animation-delay:.4s}
      @keyframes nu-dot-pop{
        0%,80%,100%{transform:scale(.7);opacity:.25}
        40%{transform:scale(1.15);opacity:1}
      }

      /* Error state */
      .loading-screen.loading-error{position:static;min-height:100vh;gap:1.25rem;padding:2rem;text-align:center}
      .loading-wordmark{display:block;font-size:1.75rem;font-weight:800;color:#A64468;letter-spacing:-0.03em;margin:0;line-height:1.1}
      .loading-screen .load-error-msg{margin:0;color:#b91c1c;font-size:0.875rem;max-width:340px}

      /* Dark mode */
      @media(prefers-color-scheme:dark){
        html,body,.loading-screen{background:#0d1117}
        .loading-dots span{background:#d472a0}
        .loading-ring{border-top-color:#d472a0;border-right-color:#A64468}
      }
    </style>
