name: Deploy to Hostinger

on:
  push:
    branches:
      - main

# ── Prevent parallel deployments ──────────────────────────────────────────────
# cancel-in-progress: false → queues the next run instead of cancelling the
# current one. Cancelling mid-upload leaves the FTP state file in a corrupted
# state, causing the next run to re-upload hundreds of files and time out.
# Queuing means: current deploy finishes cleanly, then the next commit deploys.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Upload changed files via FTPS
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── Attempt 1 ────────────────────────────────────────────────────────────
      - name: Deploy (attempt 1 of 3)
        id: deploy_1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.nursinguganda.com
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ./
          server-dir: /
          state-name: .ftp-deploy-sync-state.json
          dangerous-clean-slate: false
          log-level: standard
          exclude: |
            **/.git/**
            **/.git*
            **/node_modules/**
            **/scripts/**
            **/.claude/**
            **/.playwright-cli/**
            courses/**
            research/**
            supabase/**
            assets/css/main.css
            assets/js/app.js
            assets/images/lesson-images/**
            assets/images/optimized/**
            assets/images/programmes/**
            package.json
            package-lock.json
            .gitignore
            *.md
            _offline.html

      # ── Attempt 2 (only if attempt 1 failed) ─────────────────────────────────
      - name: Wait before retry
        if: steps.deploy_1.outcome == 'failure'
        run: |
          echo "Attempt 1 failed — waiting 25s before retry..."
          sleep 25

      - name: Deploy (attempt 2 of 3)
        id: deploy_2
        if: steps.deploy_1.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.nursinguganda.com
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ./
          server-dir: /
          state-name: .ftp-deploy-sync-state.json
          dangerous-clean-slate: false
          log-level: standard
          exclude: |
            **/.git/**
            **/.git*
            **/node_modules/**
            **/scripts/**
            **/.claude/**
            **/.playwright-cli/**
            courses/**
            research/**
            supabase/**
            assets/css/main.css
            assets/js/app.js
            assets/images/lesson-images/**
            assets/images/optimized/**
            assets/images/programmes/**
            package.json
            package-lock.json
            .gitignore
            *.md
            _offline.html

      # ── Attempt 3 (only if attempt 2 also failed) ────────────────────────────
      - name: Wait before final retry
        if: steps.deploy_1.outcome == 'failure' && steps.deploy_2.outcome == 'failure'
        run: |
          echo "Attempt 2 failed — waiting 40s before final retry..."
          sleep 40

      - name: Deploy (attempt 3 of 3)
        id: deploy_3
        if: steps.deploy_1.outcome == 'failure' && steps.deploy_2.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.nursinguganda.com
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ./
          server-dir: /
          state-name: .ftp-deploy-sync-state.json
          dangerous-clean-slate: false
          log-level: verbose
          exclude: |
            **/.git/**
            **/.git*
            **/node_modules/**
            **/scripts/**
            **/.claude/**
            **/.playwright-cli/**
            courses/**
            research/**
            supabase/**
            assets/css/main.css
            assets/js/app.js
            assets/images/lesson-images/**
            assets/images/optimized/**
            assets/images/programmes/**
            package.json
            package-lock.json
            .gitignore
            *.md
            _offline.html
