name: Deploy to Hostinger

on:
  push:
    branches:
      - main

# Queue deploys — never cancel in-progress (prevents state-file corruption)
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Upload changed files via FTPS
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── Pre-flight: test raw TCP connection to Hostinger FTP ──────────────────
      - name: Test FTP connectivity
        id: ftp_test
        continue-on-error: true
        run: |
          echo "Testing TCP connection to ftp.nursinguganda.com:21..."
          timeout 15 bash -c 'cat < /dev/tcp/ftp.nursinguganda.com/21' && echo "FTP_OK=true" >> $GITHUB_OUTPUT || echo "FTP_OK=false" >> $GITHUB_OUTPUT
          echo "Connection test done."

      - name: Wait if FTP unreachable
        if: steps.ftp_test.outputs.FTP_OK == 'false'
        run: |
          echo "FTP port not immediately reachable — waiting 60s for Hostinger to recover..."
          sleep 60

      # ── Attempt 1 (FTPS explicit, port 21) ───────────────────────────────────
      - name: Deploy — attempt 1 of 4 (ftps)
        id: deploy_1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.nursinguganda.com
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ./
          server-dir: /
          state-name: .ftp-deploy-sync-state.json
          dangerous-clean-slate: false
          log-level: standard
          exclude: |
            **/.git/**
            **/.git*
            **/node_modules/**
            **/scripts/**
            **/.claude/**
            **/.playwright-cli/**
            Midwives Revision/**
            Nurses revision/**
            NursesLabs Clone/**
            Nursing-ug Web_app/**
            *.pdf
            courses/**
            research/**
            supabase/**
            assets/css/main.css
            assets/js/app.js
            assets/images/lesson-images/**
            assets/images/optimized/**
            assets/images/programmes/**
            package.json
            package-lock.json
            .gitignore
            *.md
            _offline.html

      # ── Attempt 2 (ftps, longer wait) ────────────────────────────────────────
      - name: Wait before retry 2
        if: steps.deploy_1.outcome == 'failure'
        run: |
          echo "Attempt 1 failed. Waiting 60s before retry..."
          sleep 60

      - name: Deploy — attempt 2 of 4 (ftps)
        id: deploy_2
        if: steps.deploy_1.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.nursinguganda.com
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ./
          server-dir: /
          state-name: .ftp-deploy-sync-state.json
          dangerous-clean-slate: false
          log-level: standard
          exclude: |
            **/.git/**
            **/.git*
            **/node_modules/**
            **/scripts/**
            **/.claude/**
            **/.playwright-cli/**
            Midwives Revision/**
            Nurses revision/**
            NursesLabs Clone/**
            Nursing-ug Web_app/**
            *.pdf
            courses/**
            research/**
            supabase/**
            assets/css/main.css
            assets/js/app.js
            assets/images/lesson-images/**
            assets/images/optimized/**
            assets/images/programmes/**
            package.json
            package-lock.json
            .gitignore
            *.md
            _offline.html

      # ── Attempt 3 (fall back to plain FTP — FTPS may be blocked) ─────────────
      - name: Wait before retry 3
        if: steps.deploy_1.outcome == 'failure' && steps.deploy_2.outcome == 'failure'
        run: |
          echo "Attempts 1+2 (ftps) failed. Waiting 90s then trying plain FTP..."
          sleep 90

      - name: Deploy — attempt 3 of 4 (ftp fallback)
        id: deploy_3
        if: steps.deploy_1.outcome == 'failure' && steps.deploy_2.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.nursinguganda.com
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./
          server-dir: /
          state-name: .ftp-deploy-sync-state.json
          dangerous-clean-slate: false
          log-level: standard
          exclude: |
            **/.git/**
            **/.git*
            **/node_modules/**
            **/scripts/**
            **/.claude/**
            **/.playwright-cli/**
            Midwives Revision/**
            Nurses revision/**
            NursesLabs Clone/**
            Nursing-ug Web_app/**
            *.pdf
            courses/**
            research/**
            supabase/**
            assets/css/main.css
            assets/js/app.js
            assets/images/lesson-images/**
            assets/images/optimized/**
            assets/images/programmes/**
            package.json
            package-lock.json
            .gitignore
            *.md
            _offline.html

      # ── Attempt 4 (plain FTP, verbose — final) ───────────────────────────────
      - name: Wait before retry 4
        if: steps.deploy_1.outcome == 'failure' && steps.deploy_2.outcome == 'failure' && steps.deploy_3.outcome == 'failure'
        run: |
          echo "Attempts 1-3 failed. Waiting 120s for final attempt..."
          sleep 120

      - name: Deploy — attempt 4 of 4 (ftp verbose)
        id: deploy_4
        if: steps.deploy_1.outcome == 'failure' && steps.deploy_2.outcome == 'failure' && steps.deploy_3.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.nursinguganda.com
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./
          server-dir: /
          state-name: .ftp-deploy-sync-state.json
          dangerous-clean-slate: false
          log-level: verbose
          exclude: |
            **/.git/**
            **/.git*
            **/node_modules/**
            **/scripts/**
            **/.claude/**
            **/.playwright-cli/**
            Midwives Revision/**
            Nurses revision/**
            NursesLabs Clone/**
            Nursing-ug Web_app/**
            *.pdf
            courses/**
            research/**
            supabase/**
            assets/css/main.css
            assets/js/app.js
            assets/images/lesson-images/**
            assets/images/optimized/**
            assets/images/programmes/**
            package.json
            package-lock.json
            .gitignore
            *.md
            _offline.html

      # ── Report final outcome ──────────────────────────────────────────────────
      - name: Deployment summary
        if: always()
        run: |
          A1="${{ steps.deploy_1.outcome }}"
          A2="${{ steps.deploy_2.outcome }}"
          A3="${{ steps.deploy_3.outcome }}"
          A4="${{ steps.deploy_4.outcome }}"
          echo "Attempt 1 (ftps):     $A1"
          echo "Attempt 2 (ftps):     $A2"
          echo "Attempt 3 (ftp):      $A3"
          echo "Attempt 4 (ftp+verbose): $A4"
          if [ "$A1" = "success" ] || [ "$A2" = "success" ] || [ "$A3" = "success" ] || [ "$A4" = "success" ]; then
            echo "✅ Deployment succeeded."
          else
            echo "❌ All 4 attempts failed. Check Hostinger FTP status or re-run the workflow manually."
            exit 1
          fi
