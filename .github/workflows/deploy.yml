name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Upload changed files via FTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2   # needed so FTP action can diff against previous commit

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.nursinguganda.com
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./
          server-dir: /
          # Only send files that changed in this push
          state-name: .ftp-deploy-sync-state.json
          # Never wipe files already on server that aren't in the repo
          dangerous-clean-slate: false
          # Exclude source files, build tools, and git internals
          exclude: |
            **/.git/**
            **/.git*
            **/node_modules/**
            **/scripts/**
            **/.claude/**
            assets/css/main.css
            assets/js/app.js
            assets/images/lesson-images/**
            assets/images/optimized/**
            assets/images/programmes/**
            assets/images/pwa/**
            package.json
            package-lock.json
            .gitignore
