name: Deploy to Hostinger (Manual FTPS Backup)

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build Vite App & Upload dist/ via FTPS
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies & build Hostinger dist/
        run: |
          npm ci
          npm run build

      - name: Deploy dist/ to Hostinger FTPS (with auto-retry)
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -u "$FTP_USER","$FTP_PASS" ftp.nursinguganda.com <<'EOF'
          set ssl:verify-certificate no
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set net:max-retries 8
          set net:reconnect-interval-base 3
          set net:timeout 30
          put -O / dist/index.html
          put -O / dist/.htaccess
          mirror -R --only-newer --parallel=2 --exclude api/config.php ./dist/ /
          bye
          EOF
