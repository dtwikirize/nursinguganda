name: Update Career Jobs Daily

on:
  schedule:
    # Run at 05:00 UTC every day (08:00 EAT — East Africa Time)
    - cron: "0 5 * * *"
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions tab

permissions:
  contents: write   # needed to commit updated career-jobs.json

jobs:
  fetch-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Fetch and update job listings
        run: node scripts/fetch-jobs.js

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code assets/data/career-jobs.json \
            && echo "changed=false" >> "$GITHUB_OUTPUT" \
            || echo "changed=true"  >> "$GITHUB_OUTPUT"

      - name: Commit updated job listings
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/career-jobs.json
          git commit -m "chore: auto-update career jobs [$(date -u '+%Y-%m-%d')]"
          git push
