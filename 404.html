<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page Not Found | Nursing Uganda</title>
    <meta name="description" content="The page you are looking for could not be found on Nursing Uganda." />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/assets/images/brand/nu-variant-3-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/assets/images/brand/nu-variant-3.svg" type="image/svg+xml" />
    <style>
      :root {
        --nu-purple: #a137f2;
        --nu-purple-hover: #8710d8;
        --nu-ink: #1c1d1f;
        --nu-muted: #6a6f73;
        --nu-bg: #f7f9fa;
        --nu-card: #ffffff;
        --nu-border: #d1d7dc;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: var(--nu-bg);
        color: var(--nu-ink);
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        background: var(--nu-card);
        border: 1px solid var(--nu-border);
        border-radius: 12px;
        box-shadow: 0 8px 28px rgba(28, 29, 31, 0.08);
        max-width: 520px;
        padding: 40px 36px;
        text-align: center;
        width: 100%;
      }
      .wordmark {
        color: var(--nu-purple);
        font-size: 1rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin-bottom: 16px;
        display: inline-block;
        text-decoration: none;
      }
      .badge {
        display: inline-block;
        background: #f7edff;
        color: #6d28d9;
        border: 1px solid #e9d5ff;
        font-size: 0.75rem;
        font-weight: 700;
        padding: 4px 10px;
        border-radius: 999px;
        margin-bottom: 14px;
      }
      h1 {
        color: var(--nu-ink);
        font-size: 1.85rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin-bottom: 10px;
      }
      p {
        color: var(--nu-muted);
        font-size: 0.98rem;
        line-height: 1.6;
        margin-bottom: 24px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
      }
      a.btn {
        border-radius: 6px;
        font-size: 0.92rem;
        font-weight: 700;
        padding: 11px 20px;
        text-decoration: none;
        display: inline-block;
      }
      a.btn-primary { background: var(--nu-purple); color: #ffffff; }
      a.btn-primary:hover { background: var(--nu-purple-hover); }
      a.btn-secondary { background: #ffffff; color: var(--nu-ink); border: 1px solid var(--nu-border); }
      a.btn-secondary:hover { background: #f3f4f6; }
    </style>
  </head>
  <body>
    <main class="card">
      <a href="/" class="wordmark">Nursing Uganda</a>
      <div><span class="badge">HTTP 404</span></div>
      <h1>Page Not Found</h1>
      <p>
        The course unit, lesson, or clinical resource you requested does not exist or may have moved.
      </p>
      <div class="actions">
        <a class="btn btn-primary" href="/courses">Browse 95 Courses</a>
        <a class="btn btn-secondary" href="/">Go Home</a>
      </div>
    </main>
  </body>
</html>
