<!doctype html>

    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"></noscript>
    <style>
      :root{--primary:#0f7f4f;--navy:#1C1917;--bg:#FAF9F5;--card:#fff;--border:#E7E5DE;--muted:#78716C}
      *{box-sizing:border-box;margin:0;padding:0}
      body{background:var(--bg);color:var(--navy);font-family:"Inter",system-ui,-apple-system,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
      .card{background:var(--card);border:1px solid var(--border);border-radius:20px;box-shadow:0 16px 40px rgba(28,25,23,.08);max-width:540px;padding:48px 40px;text-align:center;width:100%}
      .icon{font-size:3.5rem;line-height:1;margin-bottom:20px}
      .wordmark{color:var(--primary);font-size:1rem;font-weight:800;letter-spacing:-0.02em;margin-bottom:24px;display:block}
      h1{color:var(--navy);font-size:2rem;font-weight:800;letter-spacing:-0.03em;margin-bottom:12px}
      p{color:var(--muted);font-size:1.05rem;line-height:1.7;margin-bottom:28px}
      .actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
      a.btn{border-radius:10px;color:#fff;display:inline-block;font-weight:700;padding:12px 22px;text-decoration:none;transition:opacity .15s}
      a.btn:hover{opacity:.88}
      a.btn-primary{background:var(--primary)}
      a.btn-secondary{background:var(--navy)}
      .code{color:var(--muted);font-size:.82rem;margin-top:24px;font-variant-numeric:tabular-nums}
      @media(prefers-color-scheme:dark){
        body{background:#0d1117}
        .card{background:#1a1a1a;border-color:#2a2a2a}
        h1{color:#f5f3ef}
        .wordmark{color:#2d9e6b}
      }
    </style>
  </head>
